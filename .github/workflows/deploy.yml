name: Build and Deploy

on:
  # Déclenché par push sur main
  push:
    branches:
      - main

  # Déclenché par webhook (depuis Kirby CMS)
  repository_dispatch:
    types: [cms-content-update]

  # Permet de déclencher manuellement
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "API_URL=https://cms.cegeswiss.com" >> .env
          echo "API_AUTH_EMAIL=${{ secrets.CMS_AUTH_EMAIL }}" >> .env
          echo "API_AUTH_PASSWORD=${{ secrets.CMS_AUTH_PASSWORD }}" >> .env
          echo "SITE_URL=https://cegeswiss.com" >> .env

      - name: Build static site
        run: npm run generate

      - name: Deploy to SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: ./.output/public/*
          remote_path: ${{ secrets.SFTP_WEBSITE_DIR }}
          sftp_only: true
